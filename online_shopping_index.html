<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Online Shopping</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f5f5f5}
header{background:#2874f0;color:#fff;padding:15px 5%;display:flex;align-items:center;justify-content:space-between}
header h1{font-size:25px}
nav a{color:#fff;text-decoration:none;margin-left:20px;font-weight:bold}
.hero{background:#fff;text-align:center;padding:50px 20px}
.hero h2{font-size:35px;margin-bottom:10px}
.hero p{color:#555;margin-bottom:20px}
button{cursor:pointer;border:0;border-radius:5px}
.hero button{background:#ff9f00;color:#fff;padding:12px 25px;font-size:16px}
.products{padding:35px 5%}
.products h2{text-align:center;margin-bottom:25px}
.product-container{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
.product{background:#fff;width:220px;padding:20px;text-align:center;border-radius:8px;box-shadow:0 2px 8px #ccc}
.product .image{font-size:70px;margin-bottom:15px}
.product h3{margin-bottom:10px}
.price{color:green;font-weight:bold;margin-bottom:15px}
.product button{background:#2874f0;color:#fff;padding:10px 18px}
.product button:hover{background:#1257c7}
.cart{background:#fff;padding:25px;text-align:center;margin-top:20px}
#cartCount,#cartCount2{color:#2874f0;font-weight:bold}
footer{background:#172337;color:#fff;text-align:center;padding:20px;margin-top:30px}
@media(max-width:600px){
header{flex-direction:column;gap:10px}
.product{width:90%}
}
</style>
</head>
<body>
<header>
<h1>ShopEasy</h1>
<nav>
<a href="#">Home</a>
<a href="#products">Products</a>
<a href="#cart">Cart 🛒 (<span id="cartCount">0</span>)</a>
</nav>
</header>

<section class="hero">
<h2>Welcome to ShopEasy</h2>
<p>Shop your favorite products online easily.</p>
<button onclick="scrollToProducts()">Shop Now</button>
</section>

<section class="products" id="products">
<h2>Our Products</h2>
<div class="product-container">
<div class="product"><div class="image">👕</div><h3>T-Shirt</h3><p class="price">₹499</p><button onclick="addToCart('T-Shirt')">Add to Cart</button></div>
<div class="product"><div class="image">👟</div><h3>Shoes</h3><p class="price">₹999</p><button onclick="addToCart('Shoes')">Add to Cart</button></div>
<div class="product"><div class="image">🎧</div><h3>Headphones</h3><p class="price">₹799</p><button onclick="addToCart('Headphones')">Add to Cart</button></div>
<div class="product"><div class="image">⌚</div><h3>Smart Watch</h3><p class="price">₹1,499</p><button onclick="addToCart('Smart Watch')">Add to Cart</button></div>
</div>
</section>

<section class="cart" id="cart">
<h2>Shopping Cart</h2>
<p>You have <span id="cartCount2">0</span> item(s) in your cart.</p>
</section>

<footer><p>© 2026 ShopEasy | Online Shopping Web Application</p></footer>

<script>
let cartCount=0;
function addToCart(productName){
cartCount++;
document.getElementById("cartCount").innerText=cartCount;
document.getElementById("cartCount2").innerText=cartCount;
alert(productName+" added to cart!");
}
function scrollToProducts(){
document.getElementById("products").scrollIntoView({behavior:"smooth"});
}
</script>
</body>
</html>
