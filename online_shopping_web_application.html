<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShopEasy - Online Shopping</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#2878f0;color:white;padding:15px 6%;display:flex;align-items:center;gap:25px;position:sticky;top:0;z-index:10}
.logo{font-size:25px;font-weight:bold}
.search{flex:1;display:flex}
.search input{width:100%;padding:11px;border:0;border-radius:5px 0 0 5px;font-size:15px}
.search button{border:0;padding:0 18px;background:#ffca28;cursor:pointer;border-radius:0 5px 5px 0}
.cart{font-size:17px;cursor:pointer}
.hero{background:white;text-align:center;padding:45px 20px;margin-bottom:20px}
.hero h1{color:#2878f0;font-size:38px;margin-bottom:10px}
.hero p{color:#555;margin-bottom:20px}
.hero button{background:#ff8c00;color:white;border:0;padding:12px 25px;border-radius:5px;cursor:pointer;font-size:16px}
.container{width:90%;max-width:1200px;margin:auto}
.filters{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.filters button{padding:9px 16px;border:1px solid #2878f0;background:white;color:#2878f0;border-radius:20px;cursor:pointer}
.filters button:hover,.filters .active{background:#2878f0;color:white}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:20px}
.card{background:white;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px #0001;padding-bottom:15px}
.card img{width:100%;height:190px;object-fit:cover}
.card-content{padding:14px}
.card h3{font-size:18px;margin-bottom:8px}
.price{font-size:19px;font-weight:bold;color:#2878f0;margin-bottom:10px}
.card button{width:100%;padding:10px;border:0;background:#2878f0;color:white;border-radius:5px;cursor:pointer}
.card button:hover{background:#125bc0}
.cart-panel{position:fixed;right:-400px;top:0;width:370px;max-width:90%;height:100%;background:white;z-index:20;box-shadow:-3px 0 10px #0003;padding:20px;transition:.3s;overflow:auto}
.cart-panel.open{right:0}
.cart-panel h2{margin-bottom:15px}
.close{float:right;background:#eee;border:0;padding:7px 10px;cursor:pointer}
.cart-item{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid #ddd;padding:12px 0}
.qty button{padding:3px 8px;margin:0 3px}
.total{font-size:20px;font-weight:bold;margin:20px 0}
.checkout{width:100%;padding:12px;background:#ff8c00;color:white;border:0;border-radius:5px;cursor:pointer}
footer{margin-top:40px;background:#222;color:white;text-align:center;padding:25px}
@media(max-width:600px){header{gap:10px}.logo{font-size:20px}.cart{font-size:14px}.hero h1{font-size:30px}}
</style>
</head>
<body>

<header>
  <div class="logo">ShopEasy</div>
  <div class="search">
    <input id="searchInput" type="text" placeholder="Search products...">
    <button onclick="searchProducts()">🔍</button>
  </div>
  <div class="cart" onclick="openCart()">🛒 Cart (<span id="cartCount">0</span>)</div>
</header>

<section class="hero">
  <h1>Welcome to ShopEasy</h1>
  <p>Find your favorite products at great prices.</p>
  <button onclick="document.getElementById('products').scrollIntoView()">Shop Now</button>
</section>

<div class="container">
  <div class="filters">
    <button class="active" onclick="filterProducts('All',this)">All</button>
    <button onclick="filterProducts('Fashion',this)">Fashion</button>
    <button onclick="filterProducts('Electronics',this)">Electronics</button>
    <button onclick="filterProducts('Home',this)">Home</button>
  </div>

  <div id="products" class="products"></div>
</div>

<div id="cartPanel" class="cart-panel">
  <button class="close" onclick="closeCart()">✕</button>
  <h2>Shopping Cart</h2>
  <div id="cartItems"></div>
  <div class="total">Total: ₹<span id="cartTotal">0</span></div>
  <button class="checkout" onclick="checkout()">Proceed to Checkout</button>
</div>

<footer>
  <p>© 2026 ShopEasy | Online Shopping Web Application</p>
</footer>

<script>
const products=[
 {id:1,name:"Classic T-Shirt",price:499,cat:"Fashion",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?auto=format&fit=crop&w=600&q=80"},
 {id:2,name:"Running Shoes",price:1499,cat:"Fashion",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80"},
 {id:3,name:"Smart Watch",price:2499,cat:"Electronics",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80"},
 {id:4,name:"Headphones",price:1299,cat:"Electronics",img:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80"},
 {id:5,name:"Coffee Maker",price:1999,cat:"Home",img:"https://images.unsplash.com/photo-1517668808823-9c01a6a3c2c5?auto=format&fit=crop&w=600&q=80"},
 {id:6,name:"Backpack",price:899,cat:"Fashion",img:"https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=600&q=80"},
 {id:7,name:"Table Lamp",price:699,cat:"Home",img:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=600&q=80"},
 {id:8,name:"Bluetooth Speaker",price:1599,cat:"Electronics",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=600&q=80"}
];
let cart=[];
let currentCategory="All";

function displayProducts(list=products){
 const box=document.getElementById("products");
 box.innerHTML=list.map(p=>`
 <div class="card">
   <img src="${p.img}" alt="${p.name}">
   <div class="card-content">
     <h3>${p.name}</h3>
     <div class="price">₹${p.price}</div>
     <button onclick="addToCart(${p.id})">Add to Cart</button>
   </div>
 </div>`).join("");
}

function addToCart(id){
 const item=cart.find(x=>x.id===id);
 if(item)item.qty++;
 else cart.push({...products.find(p=>p.id===id),qty:1});
 updateCart();
}

function updateCart(){
 document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
 document.getElementById("cartItems").innerHTML=cart.length?cart.map(x=>`
 <div class="cart-item">
  <div><b>${x.name}</b><br>₹${x.price} × ${x.qty}</div>
  <div class="qty">
   <button onclick="changeQty(${x.id},-1)">−</button>
   <button onclick="changeQty(${x.id},1)">+</button>
  </div>
 </div>`).join(""):"<p>Your cart is empty.</p>";
 document.getElementById("cartTotal").textContent=cart.reduce((s,x)=>s+x.price*x.qty,0);
}

function changeQty(id,n){
 const item=cart.find(x=>x.id===id);
 if(!item)return;
 item.qty+=n;
 if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
 updateCart();
}

function openCart(){document.getElementById("cartPanel").classList.add("open")}
function closeCart(){document.getElementById("cartPanel").classList.remove("open")}

function filterProducts(cat,btn){
 currentCategory=cat;
 document.querySelectorAll(".filters button").forEach(b=>b.classList.remove("active"));
 btn.classList.add("active");
 displayProducts(cat==="All"?products:products.filter(p=>p.cat===cat));
}

function searchProducts(){
 const q=document.getElementById("searchInput").value.toLowerCase();
 const list=products.filter(p=>
   (currentCategory==="All"||p.cat===currentCategory) &&
   p.name.toLowerCase().includes(q)
 );
 displayProducts(list);
}

document.getElementById("searchInput").addEventListener("input",searchProducts);

function checkout(){
 if(!cart.length){alert("Your cart is empty.");return;}
 alert("Order placed successfully! Thank you for shopping with ShopEasy.");
 cart=[];updateCart();closeCart();
}
displayProducts();
updateCart();
</script>
</body>
</html>
